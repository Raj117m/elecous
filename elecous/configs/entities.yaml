# The observed world (spec 10.20: regions/categories are configuration).
#
# locations: places whose environment ELECOUS observes (weather, air quality).
# topics: product/category entities whose public attention ELECOUS observes
#         via Wikipedia pageviews (real, public, licensed CC BY-SA metadata)
#         and media volume via GDELT. Articles are real en.wikipedia titles.
# themes: world phenomena tracked in media volume (GDELT).
# countries: ISO codes for calendar/economic observation.

