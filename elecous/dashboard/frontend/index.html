<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELECOUS — Demand Intelligence</title>
<style>
  :root {
    --bg: #0a0c0e;
    --panel: #101317;
    --panel-2: #14181d;
    --line: #21262d;
    --line-soft: #171c22;
    --text: #e8eaed;
    --dim: #9aa3ad;
    --faint: #5f6873;
    --accent: #d3a94f;
    --accent-soft: rgba(211,169,79,0.12);
    --up: #63d68e;
    --up-soft: rgba(99,214,142,0.12);
    --down: #e07a6a;
    --down-soft: rgba(224,122,106,0.12);
    --info: #6ea8dc;
    --info-soft: rgba(110,168,220,0.12);
    --warn: #e0b76a;
    --warn-soft: rgba(224,183,106,0.12);
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 13.5px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
    display: flex; overflow: hidden;
  }
  ::selection { background: var(--accent-soft); }
  a { color: var(--info); text-decoration: none; }

  /* ---------- sidebar ---------- */
  #nav {
    width: 216px; flex: none; background: var(--panel);
    border-right: 1px solid var(--line-soft);
    display: flex; flex-direction: column; padding: 22px 0 16px;
  }
  .brand { padding: 0 22px 26px; }
  .brand h1 { font-size: 13px; letter-spacing: 3.5px; font-weight: 600; }
  .brand h1 span { color: var(--accent); }
  .brand .tag { font-size: 10.5px; color: var(--faint); letter-spacing: 0.4px; margin-top: 3px; }
  .nav-btn {
    display: block; width: 100%; text-align: left; background: none; border: none;
    color: var(--dim); font: inherit; font-size: 13px; padding: 8px 22px;
    cursor: pointer; border-left: 2px solid transparent; transition: color .15s, background .15s;
  }
  .nav-btn:hover { color: var(--text); }
  .nav-btn.active { color: var(--text); border-left-color: var(--accent); background: rgba(255,255,255,0.025); }
  .nav-sep { font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--faint); padding: 18px 22px 6px; }
  #devNav { display: none; }
  .nav-foot { margin-top: auto; padding: 14px 22px 0; border-top: 1px solid var(--line-soft); }
  .nav-foot label { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--faint); cursor: pointer; }
  .nav-foot input { accent-color: var(--accent); }
  #liveDot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); margin-right: 6px; }
  #liveDot.on { background: var(--up); }
  .nav-live { font-size: 11px; color: var(--faint); margin-top: 10px; }

  /* ---------- main ---------- */
  #main { flex: 1; overflow-y: auto; }
  .content { max-width: 1160px; margin: 0 auto; padding: 34px 40px 80px; }
  .page-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: 6px; }
  .page-head h2 { font-size: 21px; font-weight: 500; letter-spacing: -0.3px; }
  .page-sub { color: var(--faint); font-size: 12px; margin-bottom: 24px; }

  .grid { display: grid; grid-template-columns: minmax(0,1fr) 340px; gap: 22px; align-items: start; }
  @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
  /* narrow viewports: the sidebar becomes a horizontal top bar so content
     never gets squeezed into a sliver */
  @media (max-width: 760px) {
    body { flex-direction: column; }
    #nav { width: 100%; flex-direction: row; align-items: center; gap: 2px;
           padding: 10px 12px; border-right: none; border-bottom: 1px solid var(--line-soft);
           overflow-x: auto; }
    .brand { padding: 0 12px 0 0; }
    .brand .tag, .nav-sep, .nav-live { display: none; }
    .nav-btn { width: auto; padding: 8px 10px; border-left: none;
               border-bottom: 2px solid transparent; white-space: nowrap; }
    .nav-btn.active { border-left-color: transparent; border-bottom-color: var(--accent); background: none; }
    .nav-foot { margin: 0 0 0 auto; padding: 0 0 0 10px; border-top: none; }
    .content { padding: 20px 14px 60px; }
  }

  .panel { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 10px; padding: 18px 20px; margin-bottom: 18px; }
  .panel h3 { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.6px; color: var(--dim); font-weight: 600; margin-bottom: 14px; }
  .empty { color: var(--faint); font-size: 12.5px; padding: 4px 0; }
  .muted { color: var(--faint); }
  .dimmed { color: var(--dim); }
  .mono { font-family: var(--mono); }
  .small { font-size: 11.5px; }

  .pill {
    display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 10.5px;
    letter-spacing: 0.5px; font-weight: 600; background: var(--panel-2); color: var(--dim);
    border: 1px solid var(--line-soft);
  }
  .pill.up { background: var(--up-soft); color: var(--up); border-color: transparent; }
  .pill.down { background: var(--down-soft); color: var(--down); border-color: transparent; }
  .pill.gold { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .pill.info { background: var(--info-soft); color: var(--info); border-color: transparent; }
  .pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }

  /* attention cards */
  .att-card { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 10px; padding: 18px 20px; margin-bottom: 14px; transition: border-color .15s; }
  .att-card:hover { border-color: var(--line); }
  .att-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .att-top h4 { font-size: 16px; font-weight: 500; text-transform: capitalize; }
  .att-why { color: var(--dim); font-size: 12.5px; margin: 7px 0 10px; }
  .att-meta { display: flex; flex-wrap: wrap; gap: 16px; font-size: 12px; color: var(--dim); }
  .att-meta b { color: var(--text); font-weight: 500; font-family: var(--mono); }
  .expand-btn { background: none; border: none; color: var(--info); font: inherit; font-size: 12px; cursor: pointer; padding: 8px 0 0; }
  .contract { border-top: 1px solid var(--line-soft); margin-top: 12px; padding-top: 4px; display: none; }
  .contract.open { display: block; }
  .c-row { padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
  .c-row:last-child { border-bottom: none; }
  .c-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--faint); margin-bottom: 3px; }
  .c-val { font-size: 12.5px; color: var(--dim); }
  .c-val ul { list-style: none; }
  .c-val li { padding: 1px 0; }
  .c-val li::before { content: '·'; color: var(--faint); margin-right: 7px; }

  /* feed */
  .feed-item { padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
  .feed-item:last-child { border-bottom: none; }
  .feed-item.fresh { animation: slideIn .5s ease; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  .feed-time { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
  .feed-title { font-size: 12.5px; margin: 2px 0 1px; }
  .feed-why { font-size: 11.5px; color: var(--dim); }
  .fk { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; background: var(--faint); vertical-align: 1px; }
  .fk.up { background: var(--up); } .fk.down { background: var(--down); }
  .fk.gold { background: var(--accent); } .fk.info { background: var(--info); } .fk.warn { background: var(--warn); }

  /* coverage */
  .cov-row { display: flex; align-items: center; gap: 10px; padding: 4px 0; font-size: 12.5px; }
  .cov-row .name { flex: 1; text-transform: capitalize; }
  .cov-track { width: 90px; height: 3px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .cov-track i { display: block; height: 100%; background: var(--up); }

  /* timeline */
  .tl { position: relative; margin-left: 10px; padding-left: 26px; border-left: 1px solid var(--line); }
  .tl-item { position: relative; margin-bottom: 16px; }
  .tl-item::before {
    content: ''; position: absolute; left: -31px; top: 7px; width: 9px; height: 9px;
    border-radius: 50%; background: var(--faint); border: 2px solid var(--bg);
  }
  .tl-item.future::before { background: var(--up); box-shadow: 0 0 8px rgba(99,214,142,0.35); }
  .tl-item.present::before { background: var(--info); box-shadow: 0 0 8px rgba(110,168,220,0.35); }
  .tl-item.past::before { background: var(--accent); }
  .tl-date { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .tl-card { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 8px; padding: 12px 16px; margin-top: 4px; }
  .tl-card h4 { font-size: 13.5px; font-weight: 500; }
  .tl-card p { font-size: 12px; color: var(--dim); margin-top: 3px; }
  .tl-band { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--faint); margin: 26px 0 14px; }
  .tl-band.future { color: var(--up); } .tl-band.present { color: var(--info); } .tl-band.past { color: var(--accent); }
  #tl-sentinel { padding: 18px 0; color: var(--faint); font-size: 12px; }

  /* tables */
  table.list { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.list th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 1.3px; color: var(--faint); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  table.list td { padding: 9px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
  table.list tr.click { cursor: pointer; }
  table.list tr.click:hover td { background: rgba(255,255,255,0.02); }
  .bar { width: 74px; height: 3px; background: var(--line); border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 7px; }
  .bar i { display: block; height: 100%; background: var(--accent); }

  /* controls */
  select, input[type=text], input[type=date], input[type=search] {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: 7px 10px; font: inherit; font-size: 12.5px;
  }
  select:focus, input:focus { outline: none; border-color: var(--accent); }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
  .controls label { font-size: 11px; color: var(--faint); display: flex; flex-direction: column; gap: 4px; }
  input[type=range] { accent-color: var(--accent); }
  .back-btn { background: none; border: none; color: var(--dim); font: inherit; font-size: 12px; cursor: pointer; padding: 0 0 16px; }
  .back-btn:hover { color: var(--text); }

  .section-title { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.6px; color: var(--dim); font-weight: 600; margin: 26px 0 12px; }
  .spark { width: 100%; height: 46px; }
  .err { color: var(--down); font-size: 12.5px; padding: 10px 0; }
</style>
</head>
<body>

<aside id="nav">
  <div class="brand">
    <h1>ELEC<span>OUS</span></h1>
    <div class="tag">Demand Intelligence</div>
  </div>
  <button class="nav-btn active" data-view="today" onclick="nav('today')">Today</button>
  <button class="nav-btn" data-view="timeline" onclick="nav('timeline')">Timeline</button>
  <button class="nav-btn" data-view="products" onclick="nav('products')">Products</button>
  <button class="nav-btn" data-view="search" onclick="nav('search')">Search</button>
  <div id="devNav"></div>
  <div class="nav-foot">
    <label><input type="checkbox" id="devToggle"> Developer mode</label>
    <div class="nav-live"><span id="liveDot"></span><span id="liveText">connecting…</span></div>
  </div>
</aside>

<main id="main"><div class="content" id="app"></div></main>

<script>
"use strict";
const API = "/api";
const VIEWS = {};
let currentView = "today";
let currentArg = null;

/* ------------------------------------------------ utilities */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cap = s => { s = String(s ?? ""); return s.charAt(0).toUpperCase() + s.slice(1); };
const pct = v => (v == null ? "—" : (v * 100).toFixed(0) + "%");
const num = (v, d = 2) => (v == null ? "—" : Number(v).toFixed(d));
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return esc(String(iso).slice(0, 10));
  return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
}
function fmtDateTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return esc(String(iso).slice(0, 16));
  const hh = String(d.getUTCHours()).padStart(2, "0"), mm = String(d.getUTCMinutes()).padStart(2, "0");
  return `${fmtDate(iso)} ${hh}:${mm} UTC`;
}
function windowText(w) {
  if (!w) return "window unknown";
  if (w.note) return esc(w.note);
  if (w.earliest && w.latest) return `${fmtDate(w.earliest)} – ${fmtDate(w.latest)}`;
  if (w.most_probable) return `around ${fmtDate(w.most_probable)}`;
  return "window unknown";
}
async function fetchJSON(path) {
  const r = await fetch(API + path);
  if (!r.ok) throw new Error(`${path} → ${r.status}`);
  return r.json();
}
function setLive(ok, text) {
  document.getElementById("liveDot").className = ok ? "on" : "";
  document.getElementById("liveText").textContent = text;
}

/* ------------------------------------------------ navigation */
function nav(view, arg) {
  currentView = view; currentArg = arg ?? null;
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.view === view));
  render();
}
async function render() {
  const app = document.getElementById("app");
  const fn = VIEWS[currentView];
  if (!fn) { app.innerHTML = `<div class="err">Unknown view.</div>`; return; }
  try { await fn(app, currentArg); }
  catch (e) { app.innerHTML = `<div class="err">Could not load this view: ${esc(e.message)}</div>`; }
}

/* ------------------------------------------------ live feed poller */
const FEED_KIND_DOT = {
  opportunity_new: "gold", opportunity_strengthened: "up", opportunity_weakened: "down",
  opportunity_stage: "gold", prediction_updated: "info", prediction_confirmed: "up",
  prediction_failed: "down", prediction_unjudgeable: "warn", relationship_failed: "down",
  relationship_validated: "up", relationship_rechecked: "warn", relationship_discovered: "info",
  source_connected: "info", demand_spike: "gold",
};
let feedKnown = new Set();
let feedCache = [];
function feedItemHTML(e, fresh) {
  const dot = FEED_KIND_DOT[e.kind] || "";
  return `<div class="feed-item${fresh ? " fresh" : ""}" data-fid="${esc(e.id)}">
    <div class="feed-time">${fmtDateTime(e.at)}</div>
    <div class="feed-title"><span class="fk ${dot}"></span>${esc(e.title)}</div>
    <div class="feed-why">${esc(e.why)}</div>
  </div>`;
}
async function pollFeed() {
  try {
    const data = await fetchJSON("/feed?limit=30");
    setLive(true, "live — updated " + new Date().toTimeString().slice(0, 5));
    const events = data.events || [];
    const container = document.getElementById("feedList");
    if (container) {
      const fresh = events.filter(e => !feedKnown.has(e.id));
      if (feedCache.length === 0 || !container.hasChildNodes()) {
        container.innerHTML = events.length
          ? events.map(e => feedItemHTML(e, false)).join("")
          : `<div class="empty">No intelligence events yet. Events appear here the moment opportunities move, predictions resolve, or new evidence arrives — all from real recorded activity.</div>`;
      } else {
        for (const e of fresh.reverse()) container.insertAdjacentHTML("afterbegin", feedItemHTML(e, true));
        while (container.children.length > 40) container.removeChild(container.lastChild);
      }
    }
    events.forEach(e => feedKnown.add(e.id));
    feedCache = events;
  } catch (e) { setLive(false, "reconnecting…"); }
}
setInterval(pollFeed, 15000);

/* ------------------------------------------------ TODAY */
const expandedContracts = new Set();
function contractHTML(c) {
  if (!c) return "";
  const list = arr => arr && arr.length ? `<ul>${arr.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
  const rows = [];
  rows.push(["Why ELECOUS believes this", esc(c.why)]);
  rows.push(["Supporting evidence", list(c.supporting_evidence) || `<span class="muted">none stored</span>`]);
  rows.push(["Contradicting evidence", c.contradicting_evidence ? list(c.contradicting_evidence) : `<span class="muted">${esc(c.contradicting_evidence_note)}</span>`]);
  const sales = c.expected_sales_increase || {};
  rows.push(["Expected sales increase", sales.value != null ? esc(sales.value) : `<span class="muted">${esc(sales.note)}</span>`]);
  const t = c.expected_timing || {};
  rows.push(["Expected timing", t.note ? `<span class="muted">${esc(t.note)}</span>` :
    `earliest ${fmtDate(t.earliest)} · most likely ${fmtDate(t.most_probable)} · latest ${fmtDate(t.latest)}`]);
  const p = c.expected_profit_opportunity || {};
  rows.push(["Expected profit opportunity", (p.expected_roi != null ? `expected return ${num(p.expected_roi, 1)} · importance ${esc(p.commercial_importance ?? "unknown")}<br>` : "")
    + `<span class="muted">${esc(p.note)}</span>`]);
  const r = c.risk || {};
  rows.push(["Risk", r.risk_score != null ? `risk score ${num(r.risk_score)}${r.conflicting_stories != null ? ` · conflicting stories: ${esc(r.conflicting_stories)}` : ""}` : `<span class="muted">${esc(r.note || "no risk assessment stored")}</span>`]);
  const u = c.remaining_uncertainty || {};
  rows.push(["Remaining uncertainty", (u.overall != null ? `overall ${num(u.overall)}` : `<span class="muted">not quantified</span>`)
    + (u.spread_between_relationships != null ? ` · spread between relationships ${num(u.spread_between_relationships)}` : "")]);
  rows.push(["Similar historical situations", c.similar_historical_situations
    ? `<ul>${c.similar_historical_situations.map(s => `<li>${esc(s.entity)} (${esc(s.category)}) — ${fmtDate(s.began)}, evidence ${num(s.evidence_score)}</li>`).join("")}</ul>`
    : `<span class="muted">${esc(c.similar_historical_situations_note)}</span>`]);
  return rows.map(([label, val]) => `<div class="c-row"><div class="c-label">${label}</div><div class="c-val">${val}</div></div>`).join("");
}
function toggleContract(id) {
  const el = document.getElementById("contract-" + id);
  if (!el) return;
  el.classList.toggle("open");
  if (el.classList.contains("open")) expandedContracts.add(id); else expandedContracts.delete(id);
}
function decisionPill(d) {
  if (d === "Act") return `<span class="pill up">Act now</span>`;
  if (d === "Prepare") return `<span class="pill gold">Prepare</span>`;
  if (d === "Review") return `<span class="pill warn">Review</span>`;
  if (d === "Monitor") return `<span class="pill info">Monitor</span>`;
  return d ? `<span class="pill">${esc(d)}</span>` : "";
}
function deltaText(d) {
  if (d == null) return "";
  const sign = d > 0 ? "▲" : "▼";
  const cls = d > 0 ? "up" : "down";
  return ` <span class="pill ${cls}">${sign} ${(Math.abs(d) * 100).toFixed(1)} pts</span>`;
}
let homeCache = null;
VIEWS.today = async function (app) {
  const home = await fetchJSON("/home");
  homeCache = home;
  const att = home.attention || [];
  const bench = home.benchmark || {};
  const benchTone = { good: "up", mixed: "warn", bad: "down", none: "" }[bench.tone] || "";

  const spikeText = (s) => s && s.multiplier
    ? `<span>typical past spike <b>×${s.multiplier}</b> <span class="muted small">(${s.episodes} past episodes)</span></span>`
    : `<span class="muted">no past spike sizes recorded yet</span>`;

  const tops = home.top_products || [];
  const topProductsHTML = tops.length ? `
    <div class="panel">
      <h3>Top products right now</h3>
      ${tops.map((p, i) => `
        <div class="feed-item" style="display:flex;gap:12px;align-items:baseline">
          <span class="mono muted" style="min-width:1.6em;text-align:right">${i + 1}</span>
          <div style="flex:1">
            <div class="feed-title"><b>${esc(p.product)}</b> <span class="muted small">· ${esc(p.story)}</span></div>
            <div class="feed-why">${pct(p.probability)} probability · ${windowText(p.expected_window)}${p.typical_past_spike && p.typical_past_spike.multiplier ? ` · past spikes ×${p.typical_past_spike.multiplier}` : ""} — ${esc(p.why)}</div>
          </div>
        </div>`).join("")}
    </div>` : "";

  const attHTML = att.length ? att.map((a, i) => `
    <div class="att-card">
      <div class="att-top">
        <h4>${esc(a.headline)}</h4>
        <div>${decisionPill(a.decision)}</div>
      </div>
      <div class="att-why">${esc(cap(a.why))}.</div>
      <div class="att-meta">
        <span>probability <b>${pct(a.probability)}</b>${deltaText(a.probability_delta)}</span>
        <span>expected <b>${windowText(a.expected_window)}</b></span>
        ${spikeText(a.typical_past_spike)}
        ${a.products && a.products.length ? `<span>products with evidence: <b style="font-family:var(--sans)">${esc(a.products.slice(0, 3).join(", "))}</b></span>` : `<span class="muted">no product has earned evidence yet</span>`}
      </div>
      <button class="expand-btn" onclick="toggleContract(${i})">Full reasoning ▾</button>
      <div class="contract${expandedContracts.has(i) ? " open" : ""}" id="contract-${i}">${contractHTML(a.contract)}</div>
    </div>`).join("")
    : `<div class="panel"><div class="empty">No live opportunities right now. ELECOUS is watching ${home.observation_network?.sources ?? 0} evidence sources and will surface an opportunity the moment learned relationships match the live world. ${home.verdicts?.first_verdict_due ? `First prediction verdicts due ${fmtDate(home.verdicts.first_verdict_due)}.` : "No predictions have been issued yet."}</div></div>`;

  const ch = home.changed || {};
  const changeBlock = (label, items, dot) => `

let tlState = { oldest: null, exhausted: false, loading: false, total: 0 };
function badgeHTML(b) {
  if (!b) return "";
  if (!b.predicted) return `<span class="pill">not predicted</span>`;
  if (b.verdict === "pending") return `<span class="pill info">predicted — ${esc(b.note)}</span>`;
  if (b.verdict === "correct") return `<span class="pill up">predicted ✓ correct</span>`;
  if (b.verdict === "incorrect") return `<span class="pill down">predicted ✗ judged incorrect</span>`;
  if (b.verdict) return `<span class="pill warn">predicted — ${esc(String(b.verdict).replace(/_/g, " "))}</span>`;
  return "";
}
function tlEventHTML(e) {
  if (e.phase === "future") {
    return `<div class="tl-item future"><div class="tl-date">${fmtDate(e.at)} · expected</div>
      <div class="tl-card"><h4>${esc(e.title)}</h4><p>${esc(e.detail)} · confidence ${pct(e.confidence)} · judgment due ${fmtDate(e.judgment_due)}</p></div></div>`;
  }
  return `<div class="tl-item past"><div class="tl-date">${fmtDate(e.at)}</div>
    <div class="tl-card"><h4>${esc(e.title)} ${badgeHTML(e.badge)}${e.unexpected_absence ? ` <span class="pill warn">expected spike absent</span>` : ""}</h4>
    <p>${esc(e.detail)}</p></div></div>`;
}
VIEWS.timeline = async function (app) {
  tlState = { oldest: null, exhausted: false, loading: false, total: 0 };
  const data = await fetchJSON("/timeline?limit=60");
  tlState.oldest = data.oldest_returned;
  tlState.total = data.past_total;
  tlState.exhausted = data.past_returned < 60;
  const future = (data.events || []).filter(e => e.phase === "future");
  const past = (data.events || []).filter(e => e.phase === "past");
  const present = data.present;

  app.innerHTML = `
    <div class="page-head"><h2>Timeline</h2></div>
    <div class="page-sub">${tlState.total} recorded demand spikes · every date exact · scroll down for older history</div>
    <div class="tl">
      <div class="tl-band future">Next 14 days — expected</div>
      ${future.length ? future.map(tlEventHTML).join("") : `<div class="empty" style="margin-bottom:14px">No pending predictions right now.</div>`}
      <div class="tl-band present">Now</div>
      ${present ? `<div class="tl-item present"><div class="tl-date">${fmtDateTime(present.as_of)}</div>
        <div class="tl-card"><h4>Live external forces</h4>
        <p>${present.signals.length ? present.signals.map(s => esc(s.text)).join(" · ") : "quiet — no strong signals right now"}</p></div></div>`
        : `<div class="empty" style="margin-bottom:14px">No world snapshot recorded yet.</div>`}
      <div class="tl-band past">History</div>
      <div id="tlPast">${past.length ? past.map(tlEventHTML).join("") : `<div class="empty">No demand spikes recorded yet.</div>`}</div>
      <div id="tl-sentinel">${tlState.exhausted ? "— beginning of recorded history —" : "loading more…"}</div>
    </div>`;

  const sentinel = document.getElementById("tl-sentinel");
  const observer = new IntersectionObserver(async entries => {
    if (!entries[0].isIntersecting || tlState.exhausted || tlState.loading || !tlState.oldest) return;
    tlState.loading = true;
    try {
      const more = await fetchJSON(`/timeline?limit=60&until=${encodeURIComponent(tlState.oldest)}`);
      const past2 = (more.events || []).filter(e => e.phase === "past");
      if (past2.length) document.getElementById("tlPast").insertAdjacentHTML("beforeend", past2.map(tlEventHTML).join(""));
      tlState.oldest = more.oldest_returned || tlState.oldest;
      if (more.past_returned < 60) { tlState.exhausted = true; sentinel.textContent = "— beginning of recorded history —"; }
    } catch (e) { sentinel.textContent = "could not load older history"; }
    tlState.loading = false;
  }, { root: document.getElementById("main"), rootMargin: "400px" });
  observer.observe(sentinel);
};

function sparkline(points) {
  if (!points || points.length < 2) return "";
  const vals = points.map(p => p.probability);
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = (max - min) || 1;
  const W = 320, H = 42;
  const xy = vals.map((v, i) => `${(i / (vals.length - 1) * W).toFixed(1)},${(H - 4 - (v - min) / span * (H - 8)).toFixed(1)}`);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="${xy.join(" ")}" fill="none" stroke="var(--accent)" stroke-width="1.5"/></svg>`;
}

VIEWS.search = async function (app) {
  if (!searchFacets) {
    try { searchFacets = (await fetchJSON("/search?kind=product&q=__none__")).facets; } catch (e) { searchFacets = { kinds: [], categories: [], regions: [], statuses: [] }; }
  }
  const f = searchFacets;
  const opt = (v, label) => `<option value="${esc(v)}">${esc(label ?? v)}</option>`;
  const kindLabels = { product: "Products", opportunity: "Opportunities", force: "External forces", relationship: "Relationships", spike: "Demand spikes", prediction: "Predictions" };
  app.innerHTML = `
    <div class="page-head"><h2>Search</h2></div>
    <div class="page-sub">free text plus real facets — category, region, status, confidence, time period</div>
    <div class="controls">
      <label>text<input type="search" id="sq" placeholder="e.g. camping" style="width:190px"></label>
      <label>type<select id="sk"><option value="">Everything</option>${(f.kinds || []).map(k => opt(k, kindLabels[k] || k)).join("")}</select></label>
      <label>category<select id="sc"><option value="">Any</option>${(f.categories || []).map(c => opt(c, c.replace(/_/g, " "))).join("")}</select></label>
      <label>region<select id="sr"><option value="">Any</option>${(f.regions || []).map(r => opt(r)).join("")}</select></label>
      <label>status<select id="ss"><option value="">Any</option>${(f.statuses || []).map(s => opt(s, s.replace(/_/g, " "))).join("")}</select></label>
      <label>min confidence <span id="scvLabel" class="mono">0%</span><input type="range" id="scv" min="0" max="100" value="0" style="width:110px"></label>
      <label>from<input type="date" id="sfrom"></label>
      <label>to<input type="date" id="sto"></label>
    </div>
    <div id="searchResults"><div class="empty">Type or pick a facet — results update as you go.</div></div>`;

  const run = async () => {
    const qs = new URLSearchParams();
    const q = document.getElementById("sq").value.trim();
    if (q) qs.set("q", q);
    const k = document.getElementById("sk").value; if (k) qs.set("kind", k);
    const c = document.getElementById("sc").value; if (c) qs.set("category", c);
    const r = document.getElementById("sr").value; if (r) qs.set("region", r);
    const s = document.getElementById("ss").value; if (s) qs.set("status", s);
    const cv = document.getElementById("scv").value; if (cv > 0) qs.set("min_confidence", (cv / 100).toFixed(2));
    const from = document.getElementById("sfrom").value; if (from) qs.set("since", from + "T00:00:00+00:00");
    const to = document.getElementById("sto").value; if (to) qs.set("until", to + "T23:59:59+00:00");
    document.getElementById("scvLabel").textContent = cv + "%";
    const data = await fetchJSON("/search?" + qs.toString());
    const blocks = [];
    const group = (title, items, fn) => {
      if (!items) return;
      blocks.push(`<div class="section-title">${title} <span class="muted mono">${items.length}</span></div>`
        + (items.length ? items.map(fn).join("") : `<div class="empty">no matches</div>`));
    };
    group("Products", data.products, i => `<div class="feed-item"><div class="feed-title"><a href="javascript:void(0)" onclick="nav('product','${esc(i.product_id)}')">${esc(i.title)}</a></div><div class="feed-why" style="text-transform:capitalize">${esc(String(i.category).replace(/_/g, " "))} · ${i.recorded_spikes} recorded spikes</div></div>`);
    group("Opportunities", data.opportunities, i => `<div class="feed-item"><div class="feed-title">${esc(i.title)} — ${pct(i.probability)}</div><div class="feed-why">${esc(i.decision ?? "")} · ${windowText(i.window)}${i.products && i.products.length ? " · " + esc(i.products.slice(0, 4).join(", ")) : ""}</div></div>`);
    group("External forces", data.external_forces, i => `<div class="feed-item"><div class="feed-title">${esc(i.title)}</div><div class="feed-why">confidence ${pct(i.confidence)} · ${esc(i.status ?? "")} · first seen ${fmtDate(i.first_seen)}</div></div>`);
    group("Relationships", data.relationships, i => `<div class="feed-item"><div class="feed-title">${esc(i.title)}</div><div class="feed-why">confidence ${pct(i.confidence)} · ${esc(i.status ?? "")} · first seen ${fmtDate(i.first_seen)}</div></div>`);
    group("Demand spikes", data.demand_spikes, i => `<div class="feed-item"><div class="feed-title">${esc(i.title)}</div><div class="feed-why" style="text-transform:capitalize">${esc(String(i.category ?? "").replace(/_/g, " "))} · began ${fmtDate(i.began)} · evidence ${num(i.evidence_score)}</div></div>`);
    group("Predictions", data.predictions, i => `<div class="feed-item"><div class="feed-title">${esc(i.title)}</div><div class="feed-why">status ${esc(String(i.status).replace(/_/g, " "))} · confidence ${pct(i.confidence)} · made ${fmtDate(i.made_at)} · judgment due ${fmtDate(i.judgment_due)}</div></div>`);
    document.getElementById("searchResults").innerHTML = blocks.join("") || `<div class="empty">no results</div>`;
  };
  let timer = null;
  const debounced = () => { clearTimeout(timer); timer = setTimeout(() => run().catch(() => {}), 250); };
  ["sq", "sk", "sc", "sr", "ss", "scv", "sfrom", "sto"].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener("input", debounced); el.addEventListener("change", debounced);
  });
};

    const tele = sys.scheduler_telemetry || {};
    const dbRows = Object.entries(sys.databases || {}).map(([name, d]) =>
      `<tr><td class="mono">${esc(name)}</td><td class="mono">${esc(JSON.stringify(d).slice(0, 140))}</td></tr>`).join("");
    const schedRows = (sys.scheduler || []).map(t =>
      `<tr><td class="mono">${esc(t.name)}</td><td>${esc(String(t.enabled))}</td><td class="mono">${esc(t.next_run ?? "")}</td></tr>`).join("");
    const w = act.observations || {};
    app.innerHTML = `
      <div class="page-head"><h2>[DEV] Operations</h2></div>
      <div class="page-sub">scheduler, workers, databases — raw internals, deliberately hidden from the business surface</div>
      <div class="panel"><h3>Scheduler telemetry</h3>
        <div class="small mono">running: ${esc((tele.running_tasks || []).join(", ") || "none")} · max workers: ${esc(String(tele.max_workers ?? "?"))}</div>
        <div class="small mono" style="margin-top:6px">observations — minute ${w.minute} · hour ${w.hour} · day ${w.day} · week ${w.week} · total ${w.total}</div>
      </div>
      <div class="panel"><h3>Scheduled tasks</h3><table class="list"><tr><th>task</th><th>enabled</th><th>next run</th></tr>${schedRows}</table></div>
      <div class="panel"><h3>Databases</h3><table class="list"><tr><th>db</th><th>integrity</th></tr>${dbRows}</table></div>`;
  };

  VIEWS.dev_relationships = async function (app) {
    const d = await fetchJSON("/mechanisms");
    app.innerHTML = `
      <div class="page-head"><h2>[DEV] Mechanism store</h2></div>
      <div class="page-sub">${d.mechanisms.length} latest-version mechanisms with raw ids</div>
      <div class="panel" style="padding:6px 8px"><table class="list">
        <tr><th>mechanism_id</th><th>name</th><th>lifecycle</th><th>confidence</th></tr>
        ${d.mechanisms.slice(0, 300).map(m => `<tr><td class="mono">${esc(m.mechanism_id)}</td><td style="max-width:420px">${esc(m.name)}</td><td>${esc(m.lifecycle)}</td><td class="mono">${num(m.current_confidence)}</td></tr>`).join("")}
      </table></div>`;
  };

  VIEWS.dev_forces = async function (app) {
    const d = await fetchJSON("/factors");
    app.innerHTML = `
      <div class="page-head"><h2>[DEV] Factor store</h2></div>
      <div class="page-sub">${d.factors.length} latest-version environmental factors with raw ids</div>
      <div class="panel" style="padding:6px 8px"><table class="list">
        <tr><th>factor_id</th><th>name</th><th>lifecycle</th><th>confidence</th><th>signals</th></tr>
        ${d.factors.slice(0, 300).map(f => `<tr><td class="mono">${esc(f.factor_id)}</td><td style="max-width:420px">${esc(f.name)}</td><td>${esc(f.lifecycle)}</td><td class="mono">${num(f.current_confidence)}</td><td class="mono">${(f.signals || []).length}</td></tr>`).join("")}
      </table></div>`;
  };

  VIEWS.dev_sources = async function (app) {
    const d = await fetchJSON("/observation/sources");
    app.innerHTML = `
      <div class="page-head"><h2>[DEV] Source registry</h2></div>
      <div class="page-sub">${d.sources.length} registered observation sources</div>
      <div class="panel" style="padding:6px 8px"><table class="list">
        <tr><th>source_id</th><th>name</th><th>capability</th><th>status</th><th>health</th><th>failures</th></tr>
        ${d.sources.map(s => `<tr><td class="mono">${esc(s.source_id)}</td><td>${esc(s.name)}</td><td>${esc(s.observation_capability)}</td><td>${esc(s.status)}</td><td class="mono">${num(s.health)}</td><td class="mono">${esc(String(s.failure_count))}</td></tr>`).join("")}
      </table></div>`;
  };

  if (localStorage.getItem("elecous_dev_mode") === "1") window.buildDevNav();
})();
</script>
