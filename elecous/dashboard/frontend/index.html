<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELECOUS — Intelligence Operating System</title>
<style>
  :root {
    --bg: #030303; 
    --surface: #0a0a0c; 
    --card: #111114; 
    --line: #222228; 
    --line-soft: #16161a;
    --text: #ffffff; 
    --dim: #a1a1aa; 
    --faint: #52525b;
    --accent: #d4af37; 
    --accent-dim: #4a3c11; 
    --good: #4ade80; 
    --warn: #fbbf24; 
    --bad: #f87171;
    --mono: "SF Mono", ui-monospace, Menlo, monospace;
    --sans: "SF Pro Text", "Inter", -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  body { 
    background: var(--bg); 
    color: var(--text); 
    font: 14px/1.6 var(--sans); 
    -webkit-font-smoothing: antialiased;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  ::selection { background: var(--accent-dim); }
  
  /* Layout */
  #sidebar {
    width: 260px;
    background: var(--surface);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding: 24px 0;
  }
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    overflow-y: auto;
    position: relative;
  }
  
  /* Sidebar */
  .brand {
    padding: 0 24px;
    margin-bottom: 40px;
  }
  .brand h1 {
    font-size: 14px;
    letter-spacing: 3px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .brand h1 span { color: var(--accent); }
  .nav-group {
    margin-bottom: 24px;
  }
  .nav-label {
    padding: 0 24px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--faint);
    margin-bottom: 8px;
    font-weight: 600;
  }
  .nav-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    color: var(--dim);
    padding: 10px 24px;
    cursor: pointer;
    font-size: 13.5px;
    transition: all 0.2s;
  }
  .nav-btn:hover { color: var(--text); background: rgba(255,255,255,0.03); }
  .nav-btn.active { color: var(--text); background: rgba(255,255,255,0.05); border-left: 2px solid var(--accent); }
  
  .dev-toggle {
    margin-top: auto;
    padding: 20px 24px;
    border-top: 1px solid var(--line-soft);
  }
  .dev-toggle label {
    font-size: 12px;
    color: var(--dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Main View */
  .header-bar {
    padding: 30px 40px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--line-soft);
    position: sticky;
    top: 0;
    background: rgba(3,3,3,0.9);
    backdrop-filter: blur(8px);
    z-index: 10;
  }
  .header-bar h2 { font-size: 20px; font-weight: 400; letter-spacing: -0.5px; }
  .growth-ticker { font-family: var(--mono); font-size: 12px; color: var(--good); }
  
  .content { padding: 40px; max-width: 1100px; margin: 0 auto; width: 100%; }

  /* Utilities */
  .muted { color: var(--faint); }
  .mono { font-family: var(--mono); }
  .badge { 
    display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 10px; 
    letter-spacing: 0.5px; text-transform: uppercase; font-family: var(--mono);
    background: var(--line); color: var(--dim);
  }
  .badge.good { background: rgba(74,222,128,0.1); color: var(--good); }
  .badge.warn { background: rgba(251,191,36,0.1); color: var(--warn); }
  .badge.bad { background: rgba(248,113,113,0.1); color: var(--bad); }
  .badge.accent { background: rgba(212,175,55,0.1); color: var(--accent); }

  /* Timeline View */
  .timeline { border-left: 1px solid var(--line); margin-left: 20px; padding: 20px 0; }
  .tl-node { position: relative; padding-left: 30px; margin-bottom: 30px; }
  .tl-node::before {
    content: ''; position: absolute; left: -5px; top: 6px; width: 9px; height: 9px;
    border-radius: 50%; background: var(--line); border: 2px solid var(--bg);
  }
  .tl-node.future::before { background: var(--accent); box-shadow: 0 0 10px rgba(212,175,55,0.4); }
  .tl-node.present::before { background: var(--text); }
  .tl-node.past::before { background: var(--faint); }
  .tl-node.past-good::before { background: var(--good); }
  .tl-node.past-bad::before { background: var(--bad); }

  .tl-time { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-bottom: 4px; display:block; }
  .tl-card { 
    background: var(--surface); border: 1px solid var(--line-soft); border-radius: 8px; 
    padding: 16px 20px; cursor: pointer; transition: border-color 0.2s;
  }
  .tl-card:hover { border-color: var(--line); }
  .tl-card h3 { font-size: 15px; font-weight: 500; margin-bottom: 6px; }
  .tl-card p { color: var(--dim); font-size: 13px; line-height: 1.5; }

  /* Intelligence Report (Product Briefing) */
  .briefing-header { margin-bottom: 30px; }
  .briefing-header h2 { font-size: 28px; font-weight: 500; letter-spacing: -0.5px; margin-bottom: 8px; }
  .briefing-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }
  .b-panel { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 8px; padding: 24px; }
  .b-panel h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--dim); margin-bottom: 16px; font-weight: 600;}
  
  .evidence-list { list-style: none; padding: 0; }
  .evidence-list li { margin-bottom: 10px; font-size: 13px; display: flex; gap: 10px; align-items: baseline; }
  .evidence-list.support li::before { content: '✓'; color: var(--good); font-family: var(--mono); }
  .evidence-list.against li::before { content: '✗'; color: var(--bad); font-family: var(--mono); }
  .evidence-list.unknown li::before { content: '?'; color: var(--faint); font-family: var(--mono); }

  .domain-tag { 
    display: inline-block; padding: 2px 8px; border: 1px solid var(--line); border-radius: 12px; 
    font-size: 11px; color: var(--dim); margin-right: 6px; margin-bottom: 6px;
  }

  /* Domains Coverage */
  .domain-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 13px;}
  .domain-bar .track { flex: 1; height: 4px; background: var(--line); border-radius: 4px; margin: 0 16px; overflow: hidden; }
  .domain-bar .track i { display: block; height: 100%; background: var(--text); }
  
  /* Graph */
  #d3graph { width: 100%; height: 600px; background: var(--surface); border-radius: 8px; border: 1px solid var(--line-soft); }

  /* Legacy dev view tables */
  .dev-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .dev-table th, .dev-table td { padding: 10px; text-align: left; border-bottom: 1px solid var(--line-soft); }
  .dev-table th { color: var(--faint); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; font-size: 10px; }

</style>
<script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>

<div id="sidebar">
  <div class="brand">
    <h1>ELEC<span>OUS</span></h1>
    <div class="muted mono" style="font-size:10px;margin-top:4px">Demand Intelligence OS</div>
  </div>
  
  <div class="nav-group">
    <div class="nav-label">Intelligence</div>
    <button class="nav-btn active" data-view="timeline" onclick="nav('timeline')">Timeline</button>
    <button class="nav-btn" data-view="world" onclick="nav('world')">World Model</button>
    <button class="nav-btn" data-view="domains" onclick="nav('domains')">Domains & Coverage</button>
  </div>

  <div class="nav-group" id="dev-nav" style="display:none">
    <div class="nav-label">Developer</div>
    <button class="nav-btn" data-view="legacy_mechanisms" onclick="nav('legacy_mechanisms')">Mechanisms</button>
    <button class="nav-btn" data-view="legacy_factors" onclick="nav('legacy_factors')">Factors</button>
    <button class="nav-btn" data-view="legacy_scheduler" onclick="nav('legacy_scheduler')">Scheduler & Health</button>
  </div>

  <div class="dev-toggle">
    <label><input type="checkbox" id="dev-mode-cb" onchange="toggleDevMode(this.checked)"> Enable Developer Mode</label>
  </div>
</div>

<div id="main">
  <div class="header-bar">
    <h2 id="view-title">Timeline</h2>
    <div class="growth-ticker" id="ticker">Synchronizing...</div>
  </div>
  <div class="content" id="app"></div>
</div>

<script>
const API = "/api";
let currentView = "timeline";
let isDevMode = false;
let globalData = {}; // Cache for drilldowns

async function fetchAPI(path) {
  const r = await fetch(API + path);
  if(!r.ok) throw new Error(\`API Error: \${path}\`);
  return r.json();
}

function toggleDevMode(on) {
  isDevMode = on;
  document.getElementById('dev-nav').style.display = on ? 'block' : 'none';
  if (!on && currentView.startsWith("legacy_")) nav("timeline");
}

function nav(view) {
  currentView = view;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  
  const titles = {
    timeline: "Intelligence Timeline", world: "World Model", domains: "Environmental Domains",
    legacy_mechanisms: "[DEV] Mechanism Store", legacy_factors: "[DEV] Factor Store", legacy_scheduler: "[DEV] Operations"
  };
  document.getElementById('view-title').textContent = titles[view] || "Briefing";
  
  renderView();
}

// Formatters
const prettySig = s => { const [p,d,loc]=s.split(':'); return \`\${p.replace(/_/g,' ')} \${d==='up'?'rising':'falling'}\${loc?' in '+loc:''}\`; };
const formatP = pct => (pct*100).toFixed(0)+'%';

// ---- Renderers ---- //

async function renderTimeline() {
  const [opps, acc, eps] = await Promise.all([fetchAPI("/opportunities"), fetchAPI("/predictions/accuracy"), fetchAPI("/episodes")]);
  globalData.opportunities = opps.opportunities;
  globalData.predictions = acc.recent;
  
  let html = \`<div class="timeline">\`;
  
  // Future (Opportunities)
  html += \`<h3 style="font-family:var(--mono); color:var(--accent); font-size:12px; margin-bottom:20px; letter-spacing:1px">EXPECTED DEMAND SHIFTS</h3>\`;
  const activeOpps = opps.opportunities.filter(o => o.confidence > 0.4).sort((a,b)=>b.confidence - a.confidence);
  if (activeOpps.length === 0) html += \`<div class="muted" style="margin-bottom:30px; margin-left:30px">No active predictions with high confidence.</div>\`;
  activeOpps.forEach(o => {
    html += \`
      <div class="tl-node future">
        <span class="tl-time">Expected: \${o.lead_time?.most_probable||"?"} days</span>
        <div class="tl-card" onclick="renderBriefing('opp', '\${o.opportunity_id}')">
          <div style="display:flex;justify-content:space-between">
            <h3>\${(o.categories||[]).join(", ")}</h3>
            <span class="badge accent">\${formatP(o.confidence)} Confidence</span>
          </div>
          <p>Driven by: \${o.domains?.join(", ") || "Unknown conditions"}</p>
        </div>
      </div>\`;
  });

  // Present (Live state summary)
  html += \`<h3 style="font-family:var(--mono); color:var(--text); font-size:12px; margin:40px 0 20px; letter-spacing:1px">LIVE EXTERNAL FORCES</h3>\`;
  const state = await fetchAPI("/home"); // /world-state doesn't exist anymore, /home has world_state
  const sigs = (state.world_state?.signals||[]).slice(0,5).map(s=>prettySig(s.signal_key)).join(", ");
  html += \`
    <div class="tl-node present">
      <span class="tl-time">Now</span>
      <div class="tl-card">
        <h3>Current Environment</h3>
        <p>Active shifts: \${sigs || "Quiet"}</p>
      </div>
    </div>\`;

  // Past (Validated Predictions)
  html += \`<h3 style="font-family:var(--mono); color:var(--faint); font-size:12px; margin:40px 0 20px; letter-spacing:1px">VALIDATED INTELLIGENCE</h3>\`;
  const past = (acc.recent||[]).slice(0, 10);
  past.forEach(p => {
    const isGood = p.validation_status === 'correct';
    html += \`
      <div class="tl-node \${isGood?'past-good':'past-bad'}">
        <span class="tl-time">\${p.created_at?.slice(0,10) || "Past"}</span>
        <div class="tl-card" onclick="renderBriefing('pred', '\${p.prediction_id}')">
          <div style="display:flex;justify-content:space-between">
            <h3>Prediction: \${(p.outcome?.categories||[]).join(", ")||"Demand Shift"}</h3>
            <span class="badge \${isGood?'good':p.validation_status==='incorrect'?'bad':'warn'}">\${p.validation_status}</span>
          </div>
          <p>Confidence was \${formatP(p.confidence)}</p>
        </div>
      </div>\`;
  });

  html += \`</div>\`;
  document.getElementById('app').innerHTML = html;
}

async function renderBriefing(type, id) {
  document.getElementById('view-title').textContent = "Intelligence Report";
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  
  let data, title, isPred;
  if (type === 'pred') {
    const audit = await fetchAPI(\`/audit/\${id}\`);
    data = audit.prediction;
    title = \`Prediction \${id.slice(0,8)}\`;
    isPred = true;
  } else {
    data = await fetchAPI(\`/opportunities/\${id}\`);
    title = (data.categories||[]).join(", ") + " Demand Shift";
    isPred = false;
  }

  const ev = data.structured_evidence || {supporting:[], against:[], unknowns:[], trend:"stable"};
  const domains = data.domains || [];

  let html = \`
    <button onclick="nav('timeline')" style="background:none;border:none;color:var(--dim);cursor:pointer;margin-bottom:20px;font-family:var(--mono);font-size:12px">← Back to Timeline</button>
    <div class="briefing-header">
      <h2>\${title}</h2>
      <div class="muted">Confidence: <b style="color:var(--text)">\${formatP(data.confidence||0)}</b> &nbsp;·&nbsp; Trend: <span class="\${ev.trend==='rising'?'good':'muted'}">\${ev.trend}</span></div>
      <div style="margin-top:12px">\${domains.map(d=>\`<span class="domain-tag">\${d}</span>\`).join("")}</div>
    </div>
    
    <div class="briefing-grid">
      <!-- Left Column: Reasoning -->
      <div>
        <div class="b-panel" style="margin-bottom:20px">
          <h3>Why does ELECOUS believe this?</h3>
          <p style="color:var(--dim); font-size:14px; margin-bottom:20px; line-height:1.6">
            ELECOUS has detected a confluence of external forces in \${domains.join(" and ") || "the environment"}. 
            Historically, when these specific conditions align, demand for \${(data.categories||[]).join(", ")} spikes.
          </p>
          
          <h4 style="font-size:12px; margin-bottom:10px; color:var(--text)">Supporting Evidence</h4>
          <ul class="evidence-list support">
            \${ev.supporting.map(s => \`<li>\${prettySig(s)}</li>\`).join("") || \`<li class="muted">No direct signals</li>\`}
          </ul>
          
          <h4 style="font-size:12px; margin:20px 0 10px; color:var(--text)">Contradictory Evidence</h4>
          <ul class="evidence-list against">
            \${ev.against.map(s => \`<li>\${prettySig(s)}</li>\`).join("") || \`<li class="muted">No known contradictions</li>\`}
          </ul>
        </div>
      </div>
      
      <!-- Right Column: Actionability -->
      <div>
        <div class="b-panel">
          <h3>Actionability</h3>
          <div style="margin-bottom:16px">
            <div class="muted" style="font-size:12px; margin-bottom:4px">Expected Timing</div>
            <div style="font-size:15px">\${data.lead_time?.most_probable||"?"} days</div>
          </div>
          <div style="margin-bottom:16px">
            <div class="muted" style="font-size:12px; margin-bottom:4px">Target Products</div>
            <div style="font-size:14px">\${(data.products||[]).slice(0,5).join(", ") || "Category-wide"}</div>
          </div>
          <div>
            <div class="muted" style="font-size:12px; margin-bottom:4px">Recommendation</div>
            <div style="font-size:15px; color:\${data.confidence>0.7?'var(--good)':'var(--warn)'}">
              \${data.confidence > 0.7 ? "Act Now" : "Monitor Closely"}
            </div>
          </div>
        </div>
      </div>
    </div>
  \`;
  document.getElementById('app').innerHTML = html;
}

async function renderDomains() {
  const factors = await fetchAPI("/factors");
  const counts = {};
  factors.factors.forEach(f => {
    (f.domains||[]).forEach(d => { counts[d] = (counts[d]||0) + 1; });
  });
  
  const total = Object.values(counts).reduce((a,b)=>a+b, 0) || 1;
  const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]);

  let html = \`<div class="b-panel" style="max-width:600px">
    <h3>Environmental Domain Coverage</h3>
    <p class="muted" style="margin-bottom:24px">Distribution of validated environmental forces currently tracked by ELECOUS.</p>
  \`;
  
  sorted.forEach(([domain, count]) => {
    const pct = count/total;
    html += \`
      <div class="domain-bar">
        <div style="width:120px">\${domain}</div>
        <div class="track"><i style="width:\${pct*100}%"></i></div>
        <div style="width:40px; text-align:right" class="muted">\${formatP(pct)}</div>
      </div>
    \`;
  });
  
  html += \`</div>\`;
  document.getElementById('app').innerHTML = html;
}

let d3sim = null;
async function renderWorld() {
  const g = await fetchAPI("/knowledge/graph");
  document.getElementById('app').innerHTML = \`<div id="d3graph"></div><div class="muted" style="margin-top:10px;text-align:center">The Living Intelligence Model: Watch connections form and strengthen.</div>\`;
  
  if(!window.d3) return;
  const container = document.getElementById("d3graph");
  const width = container.clientWidth;
  const height = 600;
  
  if(d3sim) d3sim.stop();
  const svg = d3.select(container).append("svg").attr("width", width).attr("height", height);
  const simulation = d3.forceSimulation(g.nodes)
      .force("link", d3.forceLink(g.links).id(d => d.id).distance(100))
      .force("charge", d3.forceManyBody().strength(-150))
      .force("center", d3.forceCenter(width / 2, height / 2));
  d3sim = simulation;
  
  const link = svg.append("g").attr("stroke", "var(--line)").attr("stroke-opacity", 0.6)
      .selectAll("line").data(g.links).join("line").attr("stroke-width", d => Math.max(1, (d.value||1)*2));
  
  const node = svg.append("g").selectAll("g").data(g.nodes).join("g")
      .call(d3.drag()
        .on("start", e=>{if(!e.active)simulation.alphaTarget(0.3).restart();e.subject.fx=e.subject.x;e.subject.fy=e.subject.y;})
        .on("drag", e=>{e.subject.fx=e.x;e.subject.fy=e.y;})
        .on("end", e=>{if(!e.active)simulation.alphaTarget(0);e.subject.fx=null;e.subject.fy=null;}));

  node.append("circle")
      .attr("r", d => d.group==="mechanism" ? 8 : 5)
      .attr("fill", d => d.group === "mechanism" ? "var(--accent)" : d.group === "factor" ? "var(--good)" : "var(--faint)")
      .attr("stroke", "var(--surface)").attr("stroke-width", 2);

  node.append("text")
      .text(d => d.label)
      .attr("x", 12).attr("y", 4)
      .style("font-size", "10px").style("fill", "var(--dim)").style("font-family", "var(--mono)")
      .style("pointer-events", "none");

  simulation.on("tick", () => {
      link.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);
      node.attr("transform", d => \`translate(\${d.x},\${d.y})\`);
  });
}

// ---- Legacy Renderers for Dev Mode ---- //

async function renderLegacyMechanisms() {
  const d = await fetchAPI("/mechanisms");
  let html = \`<table class="dev-table"><tr><th>Mechanism ID</th><th>Name</th><th>Confidence</th><th>Lifecycle</th></tr>\`;
  d.mechanisms.forEach(m => {
    html += \`<tr><td class="mono">\${m.mechanism_id}</td><td>\${m.name}</td><td>\${formatP(m.current_confidence)}</td><td><span class="badge neutral">\${m.lifecycle}</span></td></tr>\`;
  });
  html += \`</table>\`;
  document.getElementById('app').innerHTML = \`<div class="b-panel">\${html}</div>\`;
}

async function renderLegacyFactors() {
  const d = await fetchAPI("/factors");
  let html = \`<table class="dev-table"><tr><th>Factor ID</th><th>Name</th><th>Signals</th><th>Domains</th></tr>\`;
  d.factors.forEach(m => {
    html += \`<tr><td class="mono">\${m.factor_id}</td><td>\${m.name}</td><td class="mono">\${(m.signals||[]).length} signals</td><td>\${(m.domains||[]).join(", ")}</td></tr>\`;
  });
  html += \`</table>\`;
  document.getElementById('app').innerHTML = \`<div class="b-panel">\${html}</div>\`;
}

async function renderLegacyScheduler() {
  const s = await fetchAPI("/health/system");
  const tele = s.scheduler_telemetry || {};
  let html = \`
    <div class="b-panel" style="margin-bottom:20px"><h3>Telemetry</h3>
      <p>Running Tasks: \${(tele.running_tasks||[]).join(", ") || "None"}</p>
      <p>Workers: \${tele.max_workers}</p>
      <p>Running Tasks: ${(tele.running_tasks||[]).join(", ") || "None"}</p>
      <p>Workers: ${tele.max_workers}</p>
    </div>
    <div class="b-panel"><h3>Next Work</h3><table class="dev-table"><tr><th>Task</th><th>Next Run</th></tr>
  `;
  (s.scheduler||[]).forEach(t => { html += `<tr><td class="mono">${t.name}</td><td>${t.next_run}</td></tr>`; });
  html += `</table></div>`;
  document.getElementById('app').innerHTML = html;
}

// ---- Core Engine ---- //

const renderMap = {
  timeline: renderTimeline, world: renderWorld, domains: renderDomains,
  legacy_mechanisms: renderLegacyMechanisms, legacy_factors: renderLegacyFactors, legacy_scheduler: renderLegacyScheduler
};

async function renderView() {
  const app = document.getElementById('app');
  if (currentView !== 'timeline') {
    app.style.opacity = 0.5;
  }
  try {
    if (currentView === 'timeline') {
      renderTimelineFromStream();
    } else {
      await renderMap[currentView]();
    }
    app.style.opacity = 1;
  } catch (err) {
    app.innerHTML = `<div class="b-panel"><h3 style="color:var(--bad)">System Error</h3><p>${err.message}</p></div>`;
    app.style.opacity = 1;
  }
}

// Live Ticker
async function updateTicker() {
  try {
    const d = await fetchAPI("/knowledge/growth");
    const m = d.metrics.find(x => !x.value.includes("0")) || d.metrics[0];
    document.getElementById('ticker').innerHTML = `INTELLIGENCE GROWTH: <span style="color:var(--text)">${m.value}</span> <span class="muted">${m.label}</span>`;
  } catch (e) {}
}

let streamSource = null;
let streamState = { past: [], present: {}, future: [] };

function connectStream() {
  if (streamSource) streamSource.close();
  streamSource = new EventSource("/api/timeline/stream");
  
  streamSource.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'initial') {
      streamState = msg.data;
      if (currentView === 'timeline') renderTimelineFromStream();
    } else if (msg.type === 'update') {
      const evt = msg.data;
      // Differential apply based on event type
      if (evt.event_type === 'opportunity_updated' || evt.event_type === 'prediction_created' || evt.event_type === 'world_state_updated') {
        // Simple strategy: we can fetch the initial state again via a parallel fetch 
        // to stay perfectly synced without duplicating backend logic in JS.
        // Or for now just trigger a refetch of the timeline data if needed.
        fetchAPI("/timeline").then(data => {
            streamState = data;
            if (currentView === 'timeline') renderTimelineFromStream();
        });
      }
      
      // Flash a little notification
      const ticker = document.getElementById('ticker');
      const oldHtml = ticker.innerHTML;
      ticker.innerHTML = `<span style="color:var(--accent)">LIVE EVENT: ${evt.event_type}</span>`;
      setTimeout(() => ticker.innerHTML = oldHtml, 3000);
    }
  };
}

function renderTimelineFromStream() {
  let html = `<div class="timeline">`;
  
  // Future (Opportunities)
  html += `<h3 style="font-family:var(--mono); color:var(--accent); font-size:12px; margin-bottom:20px; letter-spacing:1px">EXPECTED DEMAND SHIFTS</h3>`;
  const activeOpps = (streamState.future || []).filter(o => o.confidence > 0.4).sort((a,b)=>b.confidence - a.confidence);
  if (activeOpps.length === 0) html += `<div class="muted" style="margin-bottom:30px; margin-left:30px">No active predictions with high confidence.</div>`;
  activeOpps.forEach(o => {
    html += `
      <div class="tl-node future">
        <span class="tl-time">Expected: ${o.scores?.lead_time||"?"} days</span>
        <div class="tl-card" onclick="renderBriefing('opp', '${o.opportunity_id}')">
          <div style="display:flex;justify-content:space-between">
            <h3>${(o.categories||[]).join(", ")}</h3>
            <span class="badge accent">${formatP(o.confidence)} Confidence</span>
          </div>
          <p>Driven by: ${(o.categories||[]).join(", ") || "Unknown conditions"}</p>
        </div>
      </div>`;
  });

  // Present (Live state summary)
  html += `<h3 style="font-family:var(--mono); color:var(--text); font-size:12px; margin:40px 0 20px; letter-spacing:1px">LIVE EXTERNAL FORCES</h3>`;
  const sigs = (streamState.present?.signals||[]).slice(0,5).map(s=>prettySig(s.signal_key)).join(", ");
  html += `
    <div class="tl-node present">
      <span class="tl-time">Now</span>
      <div class="tl-card">
        <h3>Current Environment</h3>
        <p>Active shifts: ${sigs || "Quiet"}</p>
      </div>
    </div>`;

  // Past (Validated Predictions/Episodes)
  html += `<h3 style="font-family:var(--mono); color:var(--faint); font-size:12px; margin:40px 0 20px; letter-spacing:1px">VALIDATED INTELLIGENCE</h3>`;
  const past = (streamState.past||[]).slice(0, 10);
  if (past.length === 0) html += `<div class="muted" style="margin-bottom:30px; margin-left:30px">No past research episodes.</div>`;
  past.forEach(p => {
    const isGood = p.confidence > 0.5;
    html += `
      <div class="tl-node ${isGood?'past-good':'past-bad'}">
        <span class="tl-time">${p.timeline?.started_at?.slice(0,10) || "Past"}</span>
        <div class="tl-card">
          <div style="display:flex;justify-content:space-between">
            <h3>Research: ${p.traits?.entity || "Demand Shift"}</h3>
            <span class="badge ${isGood?'good':'bad'}">Confidence ${formatP(p.confidence)}</span>
          </div>
          <p>Found ${p.evidence?.supporting_signals?.length || 0} supporting signals.</p>
        </div>
      </div>`;
  });

  html += `</div>`;
  document.getElementById('app').innerHTML = html;
}

setInterval(updateTicker, 10000);
updateTicker();
connectStream();
nav('timeline');

</script>
</body>
</html>
